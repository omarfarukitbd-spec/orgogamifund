name: Build & Release Flutter APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release (Direct 1-Click APK Download)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-flutter-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify google-services.json
        run: |
          mkdir -p agragami-flutter/android/app
          if [ -f "agragami-flutter/android/app/google-services.json" ]; then
            echo "google-services.json already exists in agragami-flutter/android/app/"
          elif [ -f "app/google-services.json" ]; then
            cp app/google-services.json agragami-flutter/android/app/google-services.json
            echo "Copied google-services.json from app/ to agragami-flutter/android/app/"
          fi

      - name: Setup Consistent Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ -f "agragami-flutter/android/app/debug.keystore" ]; then
            cp agragami-flutter/android/app/debug.keystore ~/.android/debug.keystore
            echo "Installed local debug.keystore into ~/.android/debug.keystore"
          fi

      - name: Install Flutter Dependencies
        working-directory: agragami-flutter
        run: flutter pub get

      - name: Build Release APK
        working-directory: agragami-flutter
        run: flutter build apk --release

      - name: Rename APK with Build Details
        run: |
          BUILD_TIME=$(date +'%Y%m%d_%H%M')
          mkdir -p build-output
          cp agragami-flutter/build/app/outputs/flutter-apk/app-release.apk build-output/OgrogamiFund-Flutter-build${{ github.run_number }}-${BUILD_TIME}.apk
          cp agragami-flutter/build/app/outputs/flutter-apk/app-release.apk build-output/OgrogamiFund-Flutter-latest.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ogrogami-fund-flutter-apk-build-${{ github.run_number }}
          path: build-output/*.apk
          retention-days: 30

      - name: Publish GitHub Release (Direct Download)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-flutter-build-${{ github.run_number }}
          name: Ogrogami Fund Somithi ERP - Flutter Build #${{ github.run_number }}
          body: |
            Automated Android APK build from GitHub Actions for Ogrogami Fund Somithi ERP (Flutter).

            Commit: `${{ github.sha }}`
            Branch: `${{ github.ref_name }}`
            Run Number: `${{ github.run_number }}`

            Download the attached `.apk` file directly to install on any Android device.
          files: build-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
