name: Build & Release Flutter APK

# m19: রিলিজ শুধু v* ট্যাগ আর হাতে চালানো (workflow_dispatch)
# থেকে হয় — main-এ প্রতিটা push-এ আর রিলিজ বানানো হয় না।
# analyze/test গেট আলাদা ci.yml-এ চলে।
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release (Direct 1-Click APK Download)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-flutter-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # m19: Flutter পিন করা — channel: stable-এ ভবিষ্যতে 3.51+
      # এলে বিল্ড ভাঙতে পারে।
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Verify google-services.json
        run: |
          mkdir -p agragami-flutter/android/app
          if [ -f "agragami-flutter/android/app/google-services.json" ]; then
            echo "google-services.json already exists in agragami-flutter/android/app/"
          elif [ -f "app/google-services.json" ]; then
            cp app/google-services.json agragami-flutter/android/app/google-services.json
            echo "Copied google-services.json from app/ to agragami-flutter/android/app/"
          fi

      # M1: রিলিজ keystore GitHub secrets থেকে আসে — রিপোতে
      # কোনো keystore নেই। Secrets (Settings → Secrets and
      # variables → Actions): ANDROID_KEYSTORE_BASE64
      # (ogrogami-release.jks-এর base64), ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD।
      # Secrets না থাকলে Gradle ডিবাগ সই দিয়ে বানায় — টেস্টের
      # জন্য চলে, Play Store-এ যাবে না।
      - name: Set up release signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > agragami-flutter/android/app/release.keystore
          cat > agragami-flutter/android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          EOF
          echo "Release keystore installed; the APK will be signed with it."

      - name: Warn if release signing is not configured
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set — the APK will be debug-signed (test-only, not Play Store ready). See fix-04-app-shell.md for the 4 secrets to add."

      - name: Install Flutter Dependencies
        working-directory: agragami-flutter
        run: flutter pub get

      - name: Read app version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' agragami-flutter/pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Build Release APK
        working-directory: agragami-flutter
        # m20: build number প্রতি রানে বাড়ে — একই সংস্করণের
        # দুই বিল্ড আলাদা থাকে, আপডেট চিনতে পারে।
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK with Build Details
        run: |
          BUILD_TIME=$(date +'%Y%m%d_%H%M')
          mkdir -p build-output
          cp agragami-flutter/build/app/outputs/flutter-apk/app-release.apk build-output/OgrogamiFund-Flutter-build${{ github.run_number }}-${BUILD_TIME}.apk
          cp agragami-flutter/build/app/outputs/flutter-apk/app-release.apk build-output/OgrogamiFund-Flutter-latest.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ogrogami-fund-flutter-apk-build-${{ github.run_number }}
          path: build-output/*.apk
          retention-days: 30

      - name: Publish GitHub Release (Direct Download)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          # ট্যাগ থেকে চালালে ট্যাগটাই রিলিজের নাম; হাতে চালালে
          # pubspec-এর সংস্করণ + রান নম্বর থেকে বানানো হয়।
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-build-{1}', steps.version.outputs.version, github.run_number) }}
          name: OgroGami Fund — ${{ github.ref_type == 'tag' && github.ref_name || format('v{0} build #{1}', steps.version.outputs.version, github.run_number) }}
          body: |
            Automated Android APK build from GitHub Actions for OgroGami Fund (Flutter).

            Commit: `${{ github.sha }}`
            Branch: `${{ github.ref_name }}`
            Run Number: `${{ github.run_number }}`

            Download the attached `.apk` file directly to install on any Android device.
          files: build-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
